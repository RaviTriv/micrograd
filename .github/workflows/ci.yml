name: CI

on:
  push:
  pull_request:

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: |
          find src include test \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format-18 --dry-run --Werror

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -DBUILD_TESTING=ON -DFETCH_MNIST=OFF
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=clang++-18

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  cuda:
    name: CUDA (cuBLAS ${{ matrix.cublas }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cublas: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA toolkit
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y cuda-nvcc-12-8 cuda-cudart-dev-12-8 libcublas-dev-12-8

      - name: Configure
        run: >
          cmake -S . -B build -DBUILD_TESTING=OFF -DFETCH_MNIST=OFF
          -DENABLE_CUDA=ON -DENABLE_CUBLAS=${{ matrix.cublas }}
          -DCMAKE_CUDA_ARCHITECTURES=80
          -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc

      - name: Build
        run: cmake --build build -j --target micrograd train_gpt

  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan -j

      - name: Test
        run: ctest --preset asan

  dataset:
    name: MNIST download
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=OFF

      - name: Fetch dataset
        run: cmake --build build --target mnist-data

      - name: Check files
        run: |
          for f in train-images-idx3-ubyte train-labels-idx1-ubyte \
                   t10k-images-idx3-ubyte t10k-labels-idx1-ubyte; do
            test -s "build/mnist-data/$f" || { echo "missing $f"; exit 1; }
          done
